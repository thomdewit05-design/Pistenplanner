# Skipilot als Android-app (Capacitor).
# - Bij elke push naar main en elke pull request: proefbouw, met een .apk om zelf op een Android-telefoon te zetten (proefadvertenties).
# - Met de hand via Actions > Android-app > Run workflow:
#     "sleutel": maakt eenmalig de uploadsleutel voor de Play Store (versleuteld met het geheim ANDROID_KEY_PASSWORD) en zet hem in de repo.
#     "playstore": bouwt het ondertekende .aab-bestand voor de Play Console.
# Uitleg: store/android/README.md
name: Android-app

on:
  workflow_dispatch:
    inputs:
      wat:
        description: "Wat wil je maken?"
        type: choice
        options: [playstore, proef, sleutel]
        default: playstore
  push:
    branches: [main]
    paths: [index.html, app.js, app.css, i18n.js, config.js, ads.js, map3d.js, terrain.js, "vendor/**", "data/index.json", "android/**", package.json, package-lock.json, capacitor.config.json, tools/build_www.mjs, .github/workflows/android.yml]
  pull_request:
    paths: [index.html, app.js, app.css, i18n.js, config.js, ads.js, map3d.js, terrain.js, "vendor/**", "data/index.json", "android/**", package.json, package-lock.json, capacitor.config.json, tools/build_www.mjs, .github/workflows/android.yml]

concurrency:
  group: android-${{ github.ref }}-${{ inputs.wat }}
  cancel-in-progress: true

jobs:
  sleutel:
    if: ${{ inputs.wat == 'sleutel' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Uploadsleutel maken en versleuteld bewaren
        env:
          P: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ ${#P} -lt 16 ]; then echo "::error::Zet eerst het geheim ANDROID_KEY_PASSWORD (minstens 16 tekens) onder Settings > Secrets and variables > Actions"; exit 1; fi
          if [ -f android/upload-key.p12.enc ]; then echo "::error::Er is al een uploadsleutel (android/upload-key.p12.enc). Een nieuwe maken kan alleen als je de oude bewust weggooit."; exit 1; fi
          keytool -genkeypair -keystore "$RUNNER_TEMP/upload.p12" -storetype PKCS12 -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$P" -keypass "$P" -dname "CN=Skipilot, O=Thom de Wit, C=NL"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$RUNNER_TEMP/upload.p12" -out android/upload-key.p12.enc -pass env:P
          echo "Vingerafdruk (SHA-256) van de uploadsleutel; die mag openbaar:"
          keytool -list -v -keystore "$RUNNER_TEMP/upload.p12" -storepass "$P" | grep -E "SHA256" || true
          rm -f "$RUNNER_TEMP/upload.p12"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/upload-key.p12.enc
          git commit -m "Uploadsleutel voor de Play Store (versleuteld)"
          git push

  android:
    if: ${{ inputs.wat != 'sleutel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Webbestanden in de app zetten
        run: |
          npm ci
          npm run android
      - name: Proefbouw (.apk)
        if: ${{ inputs.wat != 'playstore' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: .apk bewaren
        if: ${{ inputs.wat != 'playstore' }}
        uses: actions/upload-artifact@v4
        with:
          name: Skipilot-android-proef-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Ondertekend .aab voor de Play Store
        if: ${{ inputs.wat == 'playstore' }}
        working-directory: android
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}   # optioneel; zonder dit geheim het proef-ID van Google
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ ! -f upload-key.p12.enc ]; then echo "::error::Nog geen uploadsleutel. Draai eerst deze workflow met 'sleutel' (zie store/android/README.md)."; exit 1; fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then echo "::error::Geheim ANDROID_KEY_PASSWORD ontbreekt"; exit 1; fi
          export ANDROID_KEYSTORE="$RUNNER_TEMP/upload.p12"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in upload-key.p12.enc -out "$ANDROID_KEYSTORE" -pass env:ANDROID_KEY_PASSWORD
          ./gradlew bundleRelease --no-daemon --stacktrace
          rm -f "$ANDROID_KEYSTORE"
          echo "Klaar: bouwnummer (versionCode) $VERSION_CODE. Download het .aab hieronder bij Artifacts en upload het in de Play Console."
      - name: .aab bewaren
        if: ${{ inputs.wat == 'playstore' }}
        uses: actions/upload-artifact@v4
        with:
          name: Skipilot-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
