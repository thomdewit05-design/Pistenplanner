# Kwaliteitscontrole bij elke pull request: de routeberekening (tools/routes.mjs), geen fouten in de pagina, tekst past in alle knoppen (5 talen),
# en iconknoppen hebben een label voor VoiceOver/TalkBack. Zie tools/audit.mjs.
name: Controle
on:
  pull_request:
    paths: [index.html, app.js, app.css, i18n.js, config.js, map3d.js, terrain.js, tools/audit.mjs, tools/routes.mjs, tools/screens.mjs, tools/perf.mjs, 'data/**', .github/workflows/check.yml]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright klaarzetten
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Gegevensbestanden zijn geldige JSON
        run: python3 -c "import json,glob; [json.load(open(f, encoding='utf-8')) for f in sorted(glob.glob('data/*.json'))]; print('ok')"
      - name: Privacy, voorwaarden en hulp in tien talen (zelfde opbouw als de Nederlandse, pagina's actueel)
        run: node tools/legal.mjs --check
      - name: App Store-teksten in tien talen (binnen Apples limieten, invulbestand actueel)
        run: node tools/store-texts.mjs --check
      - name: Knoppen, labels en fouten controleren
        run: node tools/audit.mjs nl,de,fr,ru,ja
      - name: Routeberekening testen (niveau, gesloten liften, gezinsmodus)
        run: node tools/routes.mjs
      - name: Aantikken van pistes (informatievenster opent, alleen liftstations worden direct gekozen)
        run: node tools/taps.mjs
      - name: Schermen op iPhone-maten (lagenmenu, gebied in beeld, tabbalk, zonbalk)
        run: node tools/screens.mjs
      - name: Snelheid van de zwaarste handelingen (dagroute, gebied openen, tabs)
        run: node tools/perf.mjs
      - name: Weerlaag (antwoorden van de weerdiensten omzetten, sneeuwhoogte alleen met meting)
        run: node tools/weather.mjs
      - name: Locatie op de berg (gps-storing, aankomen, onbekend gebied)
        run: node tools/gps.mjs
      - name: Volle opslag (tijdelijke gegevens eerst weg, eerlijke melding)
        run: node tools/storage.mjs
      - name: Groepen (uitnodiging vraagt eerst, berichten versleuteld, oud plan verandert je route niet)
        run: node tools/group.mjs
      - name: Servicewerker (gedownload gebied blijft na een update)
        run: node tools/sw.mjs
      - name: Apple Watch, webkant (stappen en instellingen gaan mee, opdrachten van de Watch werken)
        run: node tools/watch.mjs
      - name: Vlieg erlangs (de piste blijft in beeld, ook met een bergtop ervoor)
        run: node tools/sight.mjs
