<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skipilot TikTok</title>
<!-- TikTok-versie van de promovideo: 1080×1920, 22 s, snelle sneden, grote ondertitels die woord voor woord opkomen.
     Zelfde opzet als promo.html: seek(t) zet de tijdlijn op een tijdstip (tools/promo-video.mjs), ?play speelt af in de browser.
     Veilige zones van TikTok: bovenste 130 px, onderste 480 px en de rechter 140 px blijven vrij van tekst. -->
<link rel="stylesheet" href="../../vendor/fonts.css">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0;background:#0F1C2B;font-family:'Barlow',system-ui,sans-serif;color:#fff}
  .abs{position:absolute;left:0;top:0;will-change:transform,opacity}
  #bg{width:1080px;height:1920px;object-fit:cover;filter:blur(26px) saturate(1.4);opacity:.7}
  #shade{width:1080px;height:1920px;background:linear-gradient(180deg,rgba(15,28,43,.9) 0%,rgba(18,68,124,.62) 40%,rgba(31,127,214,.55) 100%)}
  #glow{width:1080px;height:1920px;background:radial-gradient(60% 40% at 50% 62%,rgba(31,127,214,.55),transparent 70%)}
  .flake{position:absolute;border-radius:50%;background:#fff}
  .cap{left:60px;width:880px;text-align:center;font-weight:700;font-size:104px;line-height:1.06;letter-spacing:-1px;text-transform:uppercase}
  .cap span{display:inline-block;margin:0 .12em;opacity:0;text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 34px rgba(0,0,0,.55)}
  .cap span.hl{background:#FFC400;color:#0F1C2B;text-shadow:none;padding:.02em .2em;border-radius:22px;margin:.06em .1em}
  .cap.sm{font-size:84px}
  .cap.xl{font-size:150px;line-height:1}
  .phone{width:600px;height:1258px;border-radius:86px;background:#0b0f14;box-shadow:0 60px 140px rgba(0,0,0,.65),0 0 0 3px #2b3340 inset;opacity:0}
  .phone .scr{position:absolute;left:18px;top:18px;right:18px;bottom:18px;border-radius:70px;overflow:hidden;background:#0b0f14}
  .phone img{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:5}
  #tap{width:130px;height:130px;border-radius:50%;border:10px solid #FFC400;opacity:0;z-index:6}
  #finger{width:74px;height:74px;border-radius:50%;background:rgba(255,196,0,.9);box-shadow:0 0 0 10px rgba(255,196,0,.25);opacity:0;z-index:6}
  #watch{width:470px;height:560px;opacity:0}
  #watch .band{position:absolute;left:95px;width:280px;height:250px;background:linear-gradient(90deg,#1b2430,#2b3848,#1b2430);border-radius:40px}
  #watch .case{position:absolute;left:0;top:0;width:470px;height:560px;border-radius:118px;background:#0b0f14;box-shadow:0 50px 120px rgba(0,0,0,.7),0 0 0 4px #3a4554 inset}
  #watch .wscr{position:absolute;left:27px;top:32px;width:416px;height:496px;border-radius:92px;overflow:hidden;background:#000}
  #watch img{position:absolute;left:0;top:0;width:100%;height:100%}
  #watch .crown{position:absolute;right:-18px;top:150px;width:22px;height:90px;border-radius:10px;background:#3a4554}
  .ring{width:470px;height:560px;border-radius:130px;border:8px solid #FFC400;opacity:0}
  .big{left:60px;width:880px;text-align:center;opacity:0}
  .big b{display:block;font-weight:700;font-size:230px;line-height:.95;color:#FFC400;letter-spacing:-6px;font-variant-numeric:tabular-nums;text-shadow:0 10px 0 rgba(0,0,0,.3)}
  .big i{display:block;font-style:normal;font-weight:600;font-size:60px;text-transform:uppercase;letter-spacing:2px;margin-top:6px}
  #end{left:0;width:1080px;text-align:center;opacity:0}
  #end img{width:320px;height:320px;border-radius:72px;box-shadow:0 40px 100px rgba(0,0,0,.5)}
  #end h1{margin:46px 0 0;font-weight:700;font-size:170px;letter-spacing:-4px;line-height:1}
  #end p{margin:18px 0 0;font-weight:600;font-size:54px;color:#CFE4F8}
  #end .btn{display:inline-block;margin-top:56px;padding:32px 64px;border-radius:64px;background:#FFC400;color:#0F1C2B;font-weight:700;font-size:60px}
  #bar{left:0;top:0;height:10px;background:#FFC400;width:1080px;transform-origin:0 0}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" class="abs" alt="">
  <div id="shade" class="abs"></div><div id="glow" class="abs"></div>
  <div id="snow" class="abs" style="width:1080px;height:1920px"></div>

  <div id="pA" class="abs phone"><div class="scr">
      <img data-k="map"><img data-k="route"><img data-k="nav"><img data-k="3d"><img data-k="group-map"><img data-k="today">
      <div id="flash"></div><div id="finger" class="abs"></div><div id="tap" class="abs"></div></div></div>

  <div id="r1" class="abs ring"></div><div id="r2" class="abs ring"></div><div id="r3" class="abs ring"></div>
  <div id="watch" class="abs"><div class="band" style="top:-150px"></div><div class="band" style="bottom:-150px"></div><div class="crown"></div>
    <div class="case"></div><div class="wscr"><img data-w="1-nav"></div></div>

  <div id="n1" class="abs big"><b>0</b><i>km today</i></div>
  <div id="n2" class="abs big"><b>0</b><i>metres of descent</i></div>
  <div id="n3" class="abs big"><b>0</b><i>km/h top speed</i></div>

  <div id="caps"></div>
  <div id="end" class="abs"><img src="../../icons/icon-512.png" alt=""><h1>Skipilot</h1><p></p><div class="btn"></div></div>
  <div id="bar" class="abs"></div>
</div>
<script>
// ---------- teksten per taal (?l=en of ?l=nl). Ondertitels: [van, tot, y, tekst, klasse]; *woord* = geel gemarkeerd. ----------
const LANG = new URLSearchParams(location.search).get("l") || "en", DUR = 22;
const T = {
  en:{caps:[
      [0.10, 1.75, 520, "POV: you *never* get lost on the mountain again", "xl"],
      [1.85, 3.30, 250, "*One tap*", "xl"],
      [3.35, 5.30, 230, "Your whole ski day. *Planned.*", ""],
      [5.40, 7.00, 230, "Phone in your *pocket*", ""],
      [7.05, 9.70, 215, "Your Watch *taps* you the way", ""],
      [9.80, 12.10, 230, "Check the mountain in *3D*", ""],
      [12.20, 14.40, 230, "*Find* your friends", ""],
      [14.45, 16.10, 230, "Weather. Snow. *Lifts.*", ""],
      [16.20, 19.00, 250, "Then *flex* your ski day", "sm"]],
    nums:["km today", "metres of descent", "km/h top speed"], end:["Your navigation on the slopes", "Free on the App Store"], loc:"en-US"},
  nl:{caps:[
      [0.10, 1.75, 500, "POV: je raakt *nooit* meer de weg kwijt op de berg", "xl"],
      [1.85, 3.30, 250, "*Eén tik*", "xl"],
      [3.35, 5.30, 230, "Je hele skidag. *Gepland.*", ""],
      [5.40, 7.00, 230, "Telefoon in je *zak*", ""],
      [7.05, 9.70, 215, "Je Watch *tikt* je de weg", ""],
      [9.80, 12.10, 230, "Bekijk de berg in *3D*", ""],
      [12.20, 14.40, 230, "*Vind* je vrienden", ""],
      [14.45, 16.10, 230, "Weer. Sneeuw. *Liften.*", ""],
      [16.20, 19.00, 250, "En dan: je skidag in *cijfers*", "sm"]],
    nums:["km vandaag", "meter gedaald", "km/u topsnelheid"], end:["Jouw navigatie op de piste", "Gratis in de App Store"], loc:"nl-NL"}
};
const L = T[LANG] || T.en, CAPS = L.caps, END = L.end;
const $ = id => document.getElementById(id);
document.querySelectorAll("img[data-k]").forEach(i => i.src = `shots/${LANG}/${i.dataset.k}.png`);
document.querySelectorAll("img[data-w]").forEach(i => i.src = `shots/watch-${LANG}/${i.dataset.w}.png`);
$("bg").src = `shots/${LANG}/3d.png`;
["n1", "n2", "n3"].forEach((id, k) => $(id).querySelector("i").textContent = L.nums[k]); document.documentElement.lang = LANG;
$("end").querySelector("p").textContent = END[0]; $("end").querySelector(".btn").textContent = END[1];
const img = k => document.querySelector(`img[data-k="${k}"]`);
const capEls = CAPS.map(([a, b, y, txt, cls]) => { const d = document.createElement("div"); d.className = "abs cap " + cls;
  d.innerHTML = txt.split(" ").map(w => /^\*.*\*$/.test(w) || w.startsWith("*") || w.endsWith("*") ? `<span class="hl">${w.replace(/\*/g, "")}</span>` : `<span>${w}</span>`).join("");
  // een gemarkeerd stuk van meer woorden: elk woord krijgt de markering
  $("caps").appendChild(d); return {d, a, b, y, w:[...d.children]}; });
// markering over meer woorden ("*One tap*"): alles tussen de sterretjes
CAPS.forEach(([, , , txt], i) => { let on = false; txt.split(" ").forEach((w, k) => { const st = w.startsWith("*"), en = w.endsWith("*"); if(st) on = true; if(on) capEls[i].w[k].className = "hl"; if(en) on = false; }); });

const FL = []; { let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for(let i = 0; i < 60; i++){ const d = document.createElement("div"); d.className = "flake"; const r = 3 + rnd() * 8; d.style.width = d.style.height = r + "px"; d.style.opacity = (.2 + rnd() * .5).toFixed(2);
    $("snow").appendChild(d); FL.push({d, x:rnd() * 1080, y:rnd() * 1920, v:120 + rnd() * 220, a:20 + rnd() * 40, p:rnd() * 6.28}); } }

const clamp = x => Math.max(0, Math.min(1, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, lerp = (a, b, x) => a + (b - a) * x;
const back = x => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };    // doorschieten en terugveren
const tf = (el, x, y, s = 1, r = 0) => { el.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`; };
// de sneden: op elk van deze tijden wisselt het scherm, met een flits en een stootje
const CUTS = [[3.30, "route"], [5.35, "nav"], [9.75, "3d"], [12.15, "group-map"], [14.40, "today"]];

function render(t){
  t = Math.max(0, Math.min(DUR, t));
  // achtergrond: het 3D-scherm van de app, wazig en langzaam bewegend
  tf($("bg"), 0, -40 + Math.sin(t * .35) * 30, 1.25 + t * .006);
  for(const f of FL){ const y = (f.y + f.v * t) % 1960 - 20, x = f.x + Math.sin(f.p + t) * f.a; f.d.style.transform = `translate(${x}px,${y}px)`; }
  tf($("bar"), 0, 0); $("bar").style.transform = `scaleX(${t / DUR})`;

  // ondertitels: woord voor woord, met een veertje
  for(const c of capEls){
    const out = seg(t, c.b - .18, c.b); c.d.style.opacity = t >= c.a - .01 && t <= c.b ? 1 - out : 0; tf(c.d, 0, c.y - out * 40);
    c.w.forEach((w, i) => { const u = seg(t, c.a + i * .085, c.a + i * .085 + .26); w.style.opacity = u > 0 ? 1 : 0; w.style.transform = `scale(${u > 0 ? lerp(.5, 1, back(u)) : .5}) translateY(${(1 - eo(u)) * 30}px)`; });
  }

  // ----- telefoon -----
  const pA = $("pA"); let x = 240, y = 610, s = 1, r = 0;
  const inn = seg(t, 1.75, 2.35); y = lerp(2100, 610, eo(inn)) - Math.sin(inn * Math.PI) * 26 * (inn < 1 ? 1 : 0); r = lerp(10, 0, eo(inn));          // klapt in beeld
  // stootje bij elke snede, en afwisselend een tikje scheef
  CUTS.forEach(([c], i) => { const u = seg(t, c, c + .4); if(u > 0 && u < 1) s *= 1 + Math.sin(u * Math.PI) * .06 * (1 - u); if(t >= c) r = (i % 2 ? 2.2 : -2.2) * (1 - eo(seg(t, c, c + 1.6)) * .6); });
  s *= 1 + Math.sin(t * 1.1) * .008;                                                                // ademt een beetje
  const side = eio(seg(t, 6.8, 7.4)) - eio(seg(t, 9.45, 9.9)); x += side * -230; s *= 1 - side * .22; r += side * -6;   // opzij voor de Watch
  const st = eio(seg(t, 16.05, 16.6)); y += st * 1500; r += st * 12;                                // weg voor de cijfers
  tf(pA, x, y, s, r); pA.style.opacity = t < 1.75 || t > 16.7 ? 0 : 1;
  // welk scherm (harde snede) en de inzoom per scherm
  let cur = "map", since = 1.75; for(const [c, k] of CUTS) if(t >= c){ cur = k; since = c; }
  for(const k of ["map", "route", "nav", "3d", "group-map", "today"]) img(k).style.opacity = k === cur ? 1 : 0;
  const z = {map:[50, 60, 0], route:[50, 42, .05], nav:[50, 12, 0], "3d":[50, 40, .06], "group-map":[50, 45, .06], today:[50, 15, 0]}[cur], zu = eo(seg(t, since, since + 2.6));   // klein houden: meer snijdt tekst aan de rand af
  img(cur).style.transformOrigin = `${z[0]}% ${z[1]}%`; img(cur).style.transform = `scale(${1 + zu * z[2]})`;
  let fl = 0; for(const [c] of CUTS){ const u = seg(t, c, c + .28); if(u > 0 && u < 1) fl = (1 - u) * .45; } $("flash").style.opacity = fl;
  // de vinger en de tik op "Today's day route"
  const fg = $("finger"), fu = seg(t, 2.45, 3.05), fo = seg(t, 3.25, 3.4); fg.style.opacity = t > 2.45 && t < 3.4 ? Math.min(1, fu * 3) * (1 - fo) : 0;
  tf(fg, lerp(430, 245, eo(fu)), lerp(1180, 1032, eo(fu)), 1 - seg(t, 3.05, 3.2) * .25);
  const tp = seg(t, 3.08, 3.6), tap = $("tap"); tap.style.opacity = tp > 0 && tp < 1 ? 1 - tp : 0; tf(tap, 217, 1004, .3 + tp * 1.6);

  // ----- Watch -----
  const w = $("watch"), wi = seg(t, 7.0, 7.55), wo = eio(seg(t, 9.4, 9.85));
  const TAPS = [7.9, 8.06, 8.22, 8.75, 8.91, 9.07]; let shake = 0;
  for(const t0 of TAPS){ const u = (t - t0) / .14; if(u > 0 && u < 1) shake = Math.sin(u * Math.PI * 2) * (1 - u) * 22; }
  tf(w, lerp(1250, 520, back(wi)) + wo * 800 + shake, 930, 1.06 + Math.abs(shake) * .002, lerp(14, 5, eo(wi)) + shake * .15); w.style.opacity = t > 7.0 && t < 9.9 ? 1 : 0;
  [["r1", 7.9], ["r2", 8.22], ["r3", 8.75]].forEach(([id, t0]) => { const u = seg(t, t0, t0 + .6), e = $(id); e.style.opacity = u > 0 && u < 1 ? (1 - u) : 0; tf(e, 520, 930, 1.06 + u * .4, 5); });

  // ----- cijfers: drie klappen achter elkaar -----
  [["n1", 16.5, 31.4, 1, 640], ["n2", 17.2, 6200, 0, 930], ["n3", 17.9, 71, 0, 1220]].forEach(([id, t0, val, dec, yy]) => {
    const e = $(id), u = seg(t, t0, t0 + .3), o = 1 - seg(t, 18.85, 19.05), c = eo(seg(t, t0, t0 + .7));
    e.style.opacity = u > 0 ? o : 0; tf(e, 0, yy, u > 0 ? lerp(1.6, 1, back(u)) : 1.6);
    e.querySelector("b").textContent = dec ? (val * c).toLocaleString(L.loc, {minimumFractionDigits:1, maximumFractionDigits:1}) : Math.round(val * c).toLocaleString(L.loc); });

  // ----- afsluiting -----
  const en = $("end"), eu = seg(t, 19.05, 19.6); en.style.opacity = eu > 0 ? 1 : 0; tf(en, 0, 420);
  en.querySelector("img").style.transform = `scale(${eu > 0 ? lerp(.3, 1, back(eu)) : .3}) rotate(${(1 - eo(eu)) * -20}deg)`;
  const hu = seg(t, 19.35, 19.8), h = en.querySelector("h1"); h.style.opacity = hu > 0 ? 1 : 0; h.style.transform = `scale(${hu > 0 ? lerp(.6, 1, back(hu)) : .6})`;
  en.querySelector("p").style.opacity = seg(t, 19.75, 20.1);
  const bu = seg(t, 20.05, 20.5), bt = en.querySelector(".btn"), pulse = t > 20.5 ? 1 + Math.sin((t - 20.5) * 6) * .035 : 1;
  bt.style.opacity = bu > 0 ? 1 : 0; bt.style.transform = `scale(${(bu > 0 ? lerp(.5, 1, back(bu)) : .5) * pulse})`;
  $("glow").style.opacity = .6 + Math.sin(t * 1.3) * .2;
}
window.seek = render; window.DUR = DUR;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => { document.body.dataset.missing = (document.body.dataset.missing || "") + " " + i.src.split("/").pop(); }))]).then(() => { render(0); document.body.dataset.ready = "1"; });
if(new URLSearchParams(location.search).has("play")){
  const fit = () => { const k = Math.min(innerWidth / 1080, innerHeight / 1920); $("stage").style.transform = `translate(${(innerWidth - 1080 * k) / 2}px,${(innerHeight - 1920 * k) / 2}px) scale(${k})`; };
  fit(); addEventListener("resize", fit);
  let t0 = performance.now(), paused = 0, at = 0;
  const loop = now => { if(!paused) at = ((now - t0) / 1000) % (DUR + 1.5); render(Math.min(at, DUR)); requestAnimationFrame(loop); };
  addEventListener("keydown", e => { if(e.key === "r") t0 = performance.now(); if(e.key === "p"){ paused = !paused; if(!paused) t0 = performance.now() - at * 1000; } });
  window.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
</html>
