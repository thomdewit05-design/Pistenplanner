<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skipilot: 3 Apple Watch settings for skiers</title>
<!-- "3 Apple Watch settings every skier needs": 1080×1920, 17 s. Een lijstje met een grote teller.
     De twee instellingenschermen van Apple zijn nagetekend (geen echte schermafbeeldingen); het derde is het echte scherm van Skipilot.
     Maken: PAGE=promo-tips node tools/promo-video.mjs en -->
<link rel="stylesheet" href="../../vendor/fonts.css">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0;background:radial-gradient(120% 70% at 50% 0%,#16304C 0%,#0C1826 55%,#070D15 100%);font-family:'Barlow',system-ui,sans-serif;color:#fff}
  .abs{position:absolute;left:0;top:0;will-change:transform,opacity}
  #intro{left:80px;top:560px;width:920px;text-align:center}
  #intro b{display:block;font-weight:700;font-size:420px;line-height:.85;color:#FFC400;letter-spacing:-12px}
  #intro h1{margin:30px 0 0;font-weight:700;font-size:104px;line-height:1;letter-spacing:-3px}
  #intro p{margin:26px 0 0;font-weight:500;font-size:52px;color:#B9CCE0}
  .tip{left:0;top:0;width:1080px;height:1920px;opacity:0}
  .tip .n{position:absolute;left:84px;top:215px;font-weight:700;font-size:210px;line-height:.9;color:#FFC400;letter-spacing:-6px}
  .tip h2{position:absolute;left:250px;top:228px;width:760px;margin:0;font-weight:700;font-size:72px;line-height:1.02;letter-spacing:-2px}
  .tip .path{position:absolute;left:254px;top:330px;width:760px;font-weight:600;font-size:40px;color:#9FD0FF}
  .tip .why{position:absolute;left:90px;top:1420px;width:900px;text-align:center;font-weight:500;font-size:56px;line-height:1.14;color:#E6F0FA}
  .watch{position:absolute;left:305px;top:750px;width:470px;height:560px}
  .watch .band{position:absolute;left:92px;width:286px;height:170px;background:linear-gradient(90deg,#10161d,#2a3542 45%,#10161d);border-radius:44px}
  .watch .case{position:absolute;inset:0;border-radius:120px;background:linear-gradient(145deg,#9AA3AF 0%,#2A313B 20%,#0b0f14 50%,#3B434F 82%,#9AA3AF 100%);box-shadow:0 40px 100px rgba(0,0,0,.55)}
  .watch .inner{position:absolute;inset:9px;border-radius:112px;background:#05080C}
  .watch .wscr{position:absolute;left:27px;top:32px;width:416px;height:496px;border-radius:92px;overflow:hidden;background:#000}
  .watch .crown{position:absolute;right:-20px;top:150px;width:24px;height:92px;border-radius:10px;background:linear-gradient(90deg,#3B434F,#9AA3AF)}
  .wscr img{position:absolute;left:0;top:0;width:100%;height:100%}
  /* nagetekend instellingenscherm */
  .set{position:absolute;inset:0;padding:44px 26px 0;font-family:system-ui,-apple-system,'Barlow',sans-serif}
  .set .hd{font-size:30px;font-weight:600;color:#0A84FF;margin:0 14px 14px}
  .set .row{position:relative;margin-bottom:10px;padding:22px 24px;border-radius:24px;background:#1C1C1E;font-size:31px;font-weight:500;color:#fff}
  .set .sw{position:absolute;right:20px;top:15px;width:78px;height:46px;border-radius:23px;background:#39393D}
  .set .sw i{position:absolute;left:3px;top:3px;width:40px;height:40px;border-radius:50%;background:#fff}
  .set .ck{position:absolute;right:26px;top:20px;font-size:32px;color:#0A84FF;opacity:0}
  .ring{position:absolute;left:305px;top:750px;width:470px;height:560px;border-radius:132px;border:6px solid #FFC400;opacity:0}
  #end{left:0;top:0;width:1080px;height:1920px;opacity:0;text-align:center}
  #end h2{margin:600px 90px 0;font-weight:700;font-size:128px;line-height:1;letter-spacing:-4px}
  #end p{margin:40px 0 0;font-weight:500;font-size:56px;color:#B9CCE0}
  #end img{width:130px;height:130px;border-radius:30px;vertical-align:middle}
  #end .app{margin-top:90px} #end .app b{font-size:96px;font-weight:700;letter-spacing:-2px;vertical-align:middle;margin-left:26px}
  #bar{left:0;top:0;width:1080px;height:10px;background:#FFC400;transform-origin:0 0}
</style>
</head>
<body>
<div id="stage">
  <div id="intro" class="abs"><b>3</b><h1></h1><p></p></div>
  <div id="tips"></div>
  <div id="rings"></div>
  <div id="end" class="abs"><h2></h2><p></p><div class="app"><img src="../../icons/icon-512.png" alt=""><b>Skipilot</b></div></div>
  <div id="bar" class="abs"></div>
</div>
<script src="kit.js"></script>
<script>
const INTRO = ["Apple Watch settings every skier needs", "Do these before your next trip"];
// [titel, waar het staat, waarom, scherm]
const SET1 = `<div class="set"><div class="hd">‹ SOS</div><div class="row">Fall Detection<span class="sw"><i></i></span></div><div class="row">Always on<span class="ck">✓</span></div><div class="row" style="color:#8E8E93">Only on during workouts</div></div>`;
const SET2 = `<div class="set"><div class="hd">‹ Sounds &amp; Haptics</div><div class="row">Haptic Alerts<span class="sw"><i></i></span></div><div class="row" style="color:#8E8E93">Default</div><div class="row">Prominent<span class="ck">✓</span></div></div>`;
const TIPS = [
  ["Fall Detection: always on", "Settings → SOS → Fall Detection", "A hard fall and you don't move? Your Watch calls for help.", SET1],
  ["Haptics: Prominent", "Settings → Sounds & Haptics", "So you actually feel a tap through three layers of jacket.", SET2],
  ["Let it tap you the way", "Skipilot → start a route", "Left and right feel different. No looking, gloves stay on.", `<img src="shots/watch-${LANG}/left.png"><img id="wr" src="shots/watch-${LANG}/right.png" style="opacity:0">`],
];
const END = ["Save this for your next ski trip.", "Tip 3 is free on the App Store"];
$("intro").querySelector("h1").textContent = INTRO[0]; $("intro").querySelector("p").textContent = INTRO[1];
const els = TIPS.map(([title, path, why, scr], i) => { const d = document.createElement("div"); d.className = "abs tip";
  d.innerHTML = `<div class="n">${i + 1}</div><h2>${title}</h2><div class="path">${path}</div><div class="watch"><div class="band" style="top:-110px"></div><div class="band" style="bottom:-110px"></div><div class="crown"></div><div class="case"></div><div class="inner"></div><div class="wscr">${scr}</div></div><div class="why">${why}</div>`;
  $("tips").appendChild(d); return d; });
$("end").querySelector("h2").textContent = END[0]; $("end").querySelector("p").textContent = END[1];
const T0 = 2.2, STEP = 4.0, TE = T0 + TIPS.length * STEP;
// de tikken van de Watch bij tip 3: links (tik-tik … tik-tik), dan rechts (tik-tik-tik)
const A3 = T0 + 2 * STEP, TAPS = [...[0, .16, .61, .77].map(d => ({t:A3 + 1.2 + d, dir:-1})), ...[0, .16, .32].map(d => ({t:A3 + 2.6 + d, dir:1}))];
const rings = TAPS.map(() => { const r = document.createElement("div"); r.className = "ring"; $("rings").appendChild(r); return r; });

function render(t){
  $("bar").style.transform = `scaleX(${t / 17})`;
  const io = 1 - seg(t, T0 - .4, T0 - .1), I = $("intro"); I.style.opacity = io; I.querySelector("b").style.transform = `scale(${pop(t, .05, .5) || .4})`;
  const h = I.querySelector("h1"), hu = seg(t, .4, .8); h.style.opacity = hu; h.style.transform = `translateY(${(1 - eo(hu)) * 40}px)`; I.querySelector("p").style.opacity = seg(t, 1.0, 1.4);
  els.forEach((el, i) => { const a = T0 + i * STEP, b = a + STEP; el.style.opacity = Math.min(seg(t, a - .1, a + .15), 1 - seg(t, b - .3, b - .05));
    el.querySelector(".n").style.transform = `scale(${pop(t, a, .45) || .4})`; el.querySelector(".n").style.transformOrigin = "0 80%";
    const hu = seg(t, a + .15, a + .5), h2 = el.querySelector("h2"); h2.style.opacity = hu; h2.style.transform = `translateX(${(1 - eo(hu)) * 60}px)`; el.querySelector(".path").style.opacity = seg(t, a + .45, a + .8);
    const w = el.querySelector(".watch"), wu = seg(t, a + .2, a + .8); let shake = 0;
    if(i === 2) for(const p of TAPS){ const u = (t - p.t) / .15; if(u > 0 && u < 1) shake = p.dir * Math.sin(u * Math.PI) * (1 - u * .5) * 24; }
    w.style.transform = `translate(${shake}px,${(1 - eo(wu)) * 500}px) scale(${1.12}) rotate(${(1 - eo(wu)) * 8 + shake * .12}deg)`; w.style.opacity = wu > 0 ? 1 : 0;
    // de schakelaar gaat aan en het vinkje verschijnt
    const sw = el.querySelector(".sw"), on = eio(seg(t, a + 1.3, a + 1.6)); if(sw){ sw.style.background = on > .5 ? "#30D158" : "#39393D"; sw.firstChild.style.transform = `translateX(${on * 32}px)`; }
    const ck = el.querySelector(".ck"); if(ck){ const cu = seg(t, a + 2.0, a + 2.25); ck.style.opacity = cu; ck.style.transform = `scale(${cu > 0 ? lerp(.3, 1, back(cu)) : .3})`; ck.parentNode.style.background = cu > 0 ? `rgba(10,132,255,${.18 * cu + .0})` : "#1C1C1E"; if(cu <= 0) ck.parentNode.style.background = "#1C1C1E"; }
    if(i === 2){ const r = $("wr"); if(r) r.style.opacity = t >= A3 + 2.45 ? 1 : 0; }
    const yu = seg(t, a + 1.0, a + 1.4), wy = el.querySelector(".why"); wy.style.opacity = yu; wy.style.transform = `translateY(${(1 - eo(yu)) * 30}px)`; });
  TAPS.forEach((p, i) => { const u = seg(t, p.t, p.t + .55), e = rings[i]; e.style.opacity = u > 0 && u < 1 ? (1 - u) * .9 : 0; e.style.transform = `scale(${1.12 * (1 + u * .3)})`; });
  const en = $("end"), eu = seg(t, TE - .05, TE + .3); en.style.opacity = eu; en.querySelector("h2").style.transform = `scale(${pop(t, TE, .5) || .4})`; en.querySelector("p").style.opacity = seg(t, TE + .7, TE + 1.1); en.querySelector(".app").style.opacity = seg(t, TE + 1.1, TE + 1.5);
}
boot(17, render);
</script>
</body>
</html>
