<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skipilot Watch</title>
<!-- "De Watch-truc": 1080×1920, 13 s. Eén ding: de Apple Watch tikt op je pols en links voelt anders dan rechts.
     Zelfde opzet als promo-tiktok.html: seek(t) zet de tijdlijn (tools/promo-video.mjs met PAGE=promo-watch), ?play speelt af.
     De tikpatronen zijn die van de app (Signal.pattern in SkipilotWatchApp.swift): links tik-tik … tik-tik, rechts tik-tik-tik. -->
<link rel="stylesheet" href="../../vendor/fonts.css">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0;background:#0F1C2B;font-family:'Barlow',system-ui,sans-serif;color:#fff}
  .abs{position:absolute;left:0;top:0;will-change:transform,opacity}
  #bg{width:1080px;height:1920px;object-fit:cover;filter:blur(30px) saturate(1.4);opacity:.6}
  #shade{width:1080px;height:1920px;background:linear-gradient(180deg,rgba(15,28,43,.92) 0%,rgba(18,68,124,.66) 42%,rgba(31,127,214,.5) 100%)}
  #glow{width:1080px;height:1920px;background:radial-gradient(55% 34% at 50% 52%,rgba(255,196,0,.28),transparent 70%)}
  .flake{position:absolute;border-radius:50%;background:#fff}
  .cap{left:60px;width:880px;text-align:center;font-weight:700;font-size:104px;line-height:1.06;letter-spacing:-1px;text-transform:uppercase}
  .cap span{display:inline-block;margin:0 .12em;opacity:0;text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 34px rgba(0,0,0,.55)}
  .cap span.hl{background:#FFC400;color:#0F1C2B;text-shadow:none;padding:.02em .2em;border-radius:22px;margin:.06em .1em}
  .cap.xl{font-size:132px;line-height:1.02}
  #watch{width:470px;height:560px;opacity:0}
  #watch .band{position:absolute;left:95px;width:280px;height:330px;background:linear-gradient(90deg,#1b2430,#2b3848,#1b2430);border-radius:40px}
  #watch .case{position:absolute;left:0;top:0;width:470px;height:560px;border-radius:118px;background:#0b0f14;box-shadow:0 50px 120px rgba(0,0,0,.7),0 0 0 4px #3a4554 inset}
  #watch .wscr{position:absolute;left:27px;top:32px;width:416px;height:496px;border-radius:92px;overflow:hidden;background:#000}
  #watch img{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0}
  #watch .crown{position:absolute;right:-18px;top:150px;width:22px;height:90px;border-radius:10px;background:#3a4554}
  #wflash{position:absolute;inset:0;background:#fff;opacity:0}
  .ring{width:470px;height:560px;border-radius:130px;border:7px solid #FFC400;opacity:0}
  .dots{left:0;width:1080px;text-align:center;opacity:0;height:90px}
  .dots i{display:inline-block;width:62px;height:62px;border-radius:50%;margin:0 13px;background:rgba(255,255,255,.22)}
  .dots i.gap{background:none;width:54px}
  #end{left:0;width:1080px;text-align:center;opacity:0}
  #end img{width:320px;height:320px;border-radius:72px;box-shadow:0 40px 100px rgba(0,0,0,.5)}
  #end h1{margin:46px 0 0;font-weight:700;font-size:170px;letter-spacing:-4px;line-height:1}
  #end p{margin:18px 0 0;font-weight:600;font-size:54px;color:#CFE4F8}
  #end .btn{display:inline-block;margin-top:56px;padding:32px 64px;border-radius:64px;background:#FFC400;color:#0F1C2B;font-weight:700;font-size:60px}
  #bar{left:0;top:0;height:10px;background:#FFC400;width:1080px;transform-origin:0 0}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" class="abs" alt="">
  <div id="shade" class="abs"></div><div id="glow" class="abs"></div>
  <div id="snow" class="abs" style="width:1080px;height:1920px"></div>

  <div id="rings"></div>
  <div id="watch" class="abs"><div class="band" style="top:-250px"></div><div class="band" style="bottom:-250px"></div><div class="crown"></div>
    <div class="case"></div><div class="wscr"><img data-w="1-nav"><img data-w="left"><img data-w="right"><div id="wflash"></div></div></div>

  <div id="dL" class="abs dots"><i></i><i></i><i class="gap"></i><i></i><i></i></div>
  <div id="dR" class="abs dots"><i></i><i></i><i></i></div>

  <div id="caps"></div>
  <div id="end" class="abs"><img src="../../icons/icon-512.png" alt=""><h1>Skipilot</h1><p></p><div class="btn"></div></div>
  <div id="bar" class="abs"></div>
</div>
<script>
// ---------- teksten. Ondertitels: [van, tot, y, tekst, klasse]; *woord* = geel gemarkeerd. ----------
const LANG = new URLSearchParams(location.search).get("l") || "en", DUR = 13;
const T = {
  en:{caps:[
      [0.10, 1.80, 240, "Your Watch can *feel* the way", ""],
      [1.90, 5.00, 230, "*Left:* tap-tap … tap-tap", ""],
      [5.10, 8.00, 230, "*Right:* tap-tap-tap", ""],
      [8.10, 10.30, 240, "Eyes up. *Gloves on.*", ""]],
    end:["Navigation you can feel", "Free on the App Store"]}
};
const L = T[LANG] || T.en, CAPS = L.caps;
const $ = id => document.getElementById(id);
document.querySelectorAll("img[data-w]").forEach(i => i.src = `shots/watch-${LANG}/${i.dataset.w}.png`);
$("bg").src = `shots/${LANG}/3d.png`;
$("end").querySelector("p").textContent = L.end[0]; $("end").querySelector(".btn").textContent = L.end[1];
const wimg = k => document.querySelector(`img[data-w="${k}"]`);
const capEls = CAPS.map(([a, b, y, txt, cls]) => { const d = document.createElement("div"); d.className = "abs cap " + cls;
  let on = false; d.innerHTML = txt.split(" ").map(w => { const st = w.startsWith("*"), en = w.endsWith("*"); if(st) on = true; const h = on; if(en) on = false; return `<span${h ? ' class="hl"' : ""}>${w.replace(/\*/g, "")}</span>`; }).join("");
  $("caps").appendChild(d); return {d, a, b, y, w:[...d.children]}; });

// de tikpatronen van de app, elk twee keer in zijn scène
const PAT = {left:[0, .16, .61, .77], right:[0, .16, .32]};
const PLAY = [["left", 2.55], ["left", 3.85], ["right", 5.65], ["right", 6.75]];
const TAPS = PLAY.flatMap(([k, t0]) => PAT[k].map((d, i) => ({k, t:t0 + d, i})));
const rings = TAPS.map(() => { const r = document.createElement("div"); r.className = "abs ring"; $("rings").appendChild(r); return r; });

const FL = []; { let s = 5; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for(let i = 0; i < 50; i++){ const d = document.createElement("div"); d.className = "flake"; const r = 3 + rnd() * 8; d.style.width = d.style.height = r + "px"; d.style.opacity = (.2 + rnd() * .5).toFixed(2);
    $("snow").appendChild(d); FL.push({d, x:rnd() * 1080, y:rnd() * 1920, v:120 + rnd() * 220, a:20 + rnd() * 40, p:rnd() * 6.28}); } }

const clamp = x => Math.max(0, Math.min(1, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, lerp = (a, b, x) => a + (b - a) * x;
const back = x => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const tf = (el, x, y, s = 1, r = 0) => { el.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`; };
const CUTS = [[1.85, "left"], [5.05, "right"], [8.05, "1-nav"]];
const WX = 305, WY = 810, WS = 1.3;

function render(t){
  t = Math.max(0, Math.min(DUR, t));
  tf($("bg"), 0, -40 + Math.sin(t * .4) * 30, 1.25 + t * .008);
  for(const f of FL){ const y = (f.y + f.v * t) % 1960 - 20, x = f.x + Math.sin(f.p + t) * f.a; f.d.style.transform = `translate(${x}px,${y}px)`; }
  $("bar").style.transform = `scaleX(${t / DUR})`;

  for(const c of capEls){
    const out = seg(t, c.b - .18, c.b); c.d.style.opacity = t >= c.a - .01 && t <= c.b ? 1 - out : 0; tf(c.d, 0, c.y - out * 40);
    c.w.forEach((w, i) => { const u = seg(t, c.a + i * .085, c.a + i * .085 + .26); w.style.opacity = u > 0 ? 1 : 0; w.style.transform = `scale(${u > 0 ? lerp(.5, 1, back(u)) : .5}) translateY(${(1 - eo(u)) * 30}px)`; });
  }

  // ----- de Watch: klapt in beeld, schudt bij elke tik (naar links bij links, naar rechts bij rechts) -----
  const w = $("watch"), wi = seg(t, .15, .8), wo = eio(seg(t, 10.2, 10.75));
  let shake = 0, kick = 0;
  for(const p of TAPS){ const u = (t - p.t) / .15; if(u > 0 && u < 1){ const dir = p.k === "left" ? -1 : 1; shake = dir * Math.sin(u * Math.PI) * (1 - u * .5) * 34 + Math.sin(u * Math.PI * 4) * 6 * (1 - u); kick = Math.sin(u * Math.PI) * .035; } }
  let s = WS; CUTS.forEach(([c]) => { const u = seg(t, c, c + .4); if(u > 0 && u < 1) s *= 1 + Math.sin(u * Math.PI) * .07 * (1 - u); });
  s *= 1 + Math.sin(t * 1.2) * .008 + kick;
  tf(w, WX + shake, lerp(2200, WY, eo(wi)) + wo * 1700, s, lerp(16, 0, eo(wi)) + shake * .16 + Math.sin(t * .9) * 1.2); w.style.opacity = t < .15 || t > 10.8 ? 0 : 1;
  let cur = "1-nav"; for(const [c, k] of CUTS) if(t >= c) cur = k;
  for(const k of ["1-nav", "left", "right"]) wimg(k).style.opacity = k === cur ? 1 : 0;
  let fl = 0; for(const [c] of CUTS){ const u = seg(t, c, c + .28); if(u > 0 && u < 1) fl = (1 - u) * .5; } $("wflash").style.opacity = fl;
  TAPS.forEach((p, i) => { const u = seg(t, p.t, p.t + .55), e = rings[i]; e.style.opacity = u > 0 && u < 1 ? (1 - u) * .95 : 0; tf(e, WX, WY, WS * (1 + u * .32)); });

  // ----- de stippen: het ritme zichtbaar -----
  for(const [id, k, a, b] of [["dL", "left", 2.0, 5.0], ["dR", "right", 5.2, 8.0]]){
    const el = $(id); el.style.opacity = Math.min(seg(t, a, a + .3), 1 - seg(t, b - .2, b)); tf(el, 0, 560);
    const dots = [...el.children].filter(d => !d.classList.contains("gap"));
    dots.forEach((d, i) => { let lit = 0, pop = 0;
      for(const p of TAPS) if(p.k === k && p.i === i){ const u = (t - p.t) / .5; if(u >= 0 && u < 1){ lit = Math.max(lit, 1 - u * .55); pop = Math.max(pop, Math.sin(Math.min(1, u * 3) * Math.PI) * .45); } else if(u >= 1 && t < p.t + 1.05) lit = Math.max(lit, .45); }
      d.style.background = lit > 0 ? `rgba(255,196,0,${(.35 + lit * .65).toFixed(2)})` : "rgba(255,255,255,.22)"; d.style.transform = `scale(${1 + pop})`; d.style.boxShadow = lit > .6 ? `0 0 ${Math.round(lit * 50)}px rgba(255,196,0,.8)` : "none"; });
  }

  // ----- afsluiting -----
  const en = $("end"), eu = seg(t, 10.45, 11.0); en.style.opacity = eu > 0 ? 1 : 0; tf(en, 0, 420);
  en.querySelector("img").style.transform = `scale(${eu > 0 ? lerp(.3, 1, back(eu)) : .3}) rotate(${(1 - eo(eu)) * -20}deg)`;
  const hu = seg(t, 10.75, 11.2), h = en.querySelector("h1"); h.style.opacity = hu > 0 ? 1 : 0; h.style.transform = `scale(${hu > 0 ? lerp(.6, 1, back(hu)) : .6})`;
  en.querySelector("p").style.opacity = seg(t, 11.1, 11.45);
  const bu = seg(t, 11.4, 11.85), bt = en.querySelector(".btn"), pulse = t > 11.85 ? 1 + Math.sin((t - 11.85) * 6) * .035 : 1;
  bt.style.opacity = bu > 0 ? 1 : 0; bt.style.transform = `scale(${(bu > 0 ? lerp(.5, 1, back(bu)) : .5) * pulse})`;
  $("glow").style.opacity = t > 10.3 ? .4 : .7 + Math.sin(t * 1.3) * .2;
}
window.seek = render; window.DUR = DUR;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => { document.body.dataset.missing = (document.body.dataset.missing || "") + " " + i.src.split("/").pop(); }))]).then(() => { render(0); document.body.dataset.ready = "1"; });
if(new URLSearchParams(location.search).has("play")){
  const fit = () => { const k = Math.min(innerWidth / 1080, innerHeight / 1920); $("stage").style.transform = `translate(${(innerWidth - 1080 * k) / 2}px,${(innerHeight - 1920 * k) / 2}px) scale(${k})`; };
  fit(); addEventListener("resize", fit);
  let t0 = performance.now(), paused = 0, at = 0;
  const loop = now => { if(!paused) at = ((now - t0) / 1000) % (DUR + 1.5); render(Math.min(at, DUR)); requestAnimationFrame(loop); };
  addEventListener("keydown", e => { if(e.key === "r") t0 = performance.now(); if(e.key === "p"){ paused = !paused; if(!paused) t0 = performance.now() - at * 1000; } });
  window.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
</html>
