<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../vendor/fonts.css">
<style>
html,body{margin:0;width:1290px;height:2796px;overflow:hidden}
.bg{position:absolute;inset:0;background:linear-gradient(180deg,#4C97FF 0%,#1F5FD6 45%,#0D2F7A 100%)}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(900px 500px at 85% 6%,rgba(255,255,255,.28),transparent 70%)}
.cap{position:absolute;left:80px;right:80px;top:140px;text-align:center;color:#fff}
.cap h1{margin:0;font:800 124px/1.0 'Barlow Condensed',sans-serif;letter-spacing:.005em;text-shadow:0 6px 28px rgba(5,20,60,.3)}
.cap p{margin:30px 0 0;font:500 50px/1.3 Barlow,sans-serif;color:rgba(255,255,255,.92)}
.phone{position:absolute;left:50%;transform:translateX(-50%);width:980px;top:560px;border-radius:132px;background:#0B1220;padding:24px;box-shadow:0 40px 120px rgba(5,20,60,.5),inset 0 0 0 3px rgba(255,255,255,.12)}
.phone img{display:block;width:932px;border-radius:108px}
</style></head><body><div class="bg"></div>
<div class="cap"><h1 id="h"></h1><p id="s"></p></div>
<div class="phone"><img id="img"></div>
<script>
// gebruik: compose.html?l=nl&n=0 (schermafbeeldingen uit de echte app in src/, koppen in captions.json)
const q = new URLSearchParams(location.search), lang = q.get('l') || 'nl', n = +q.get('n');
fetch('captions.json').then(r => r.json()).then(C => {
  const [f, h, s] = C[lang][n]; document.getElementById('h').textContent = h; document.getElementById('s').textContent = s;
  const img = document.getElementById('img'); img.onload = () => document.body.dataset.ready = 1; img.src = `src/${f}.png`;
});
</script></body></html>
